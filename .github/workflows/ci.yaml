name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * SAT"

jobs:
  integration-test:
    uses: javierdelapuente/operator-ci-poc/.github/workflows/integration-test.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      actions: read
